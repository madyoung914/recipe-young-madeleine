{% extends 'base.html' %}


{% block content %}
<h2>Page {{ object.pk }}</h2>
<h3>{{ object.name }}</h3>
<h4>Created by: {{ object.author }}</h4>
<ul>
    {% for ingredient in object.ingredients.all  %}
        <li>{{ ingredient.ingredient.name }}: {{ ingredient.get_quantity }}</li>
    {% endfor %}
</ul>

{% endblock %}
